<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện trắc nghiệm Hóa đại cương</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mut:#5b6475;--bd:#dde1e8;--ac:#2563eb;--acbg:#e8efff;--ok:#16794a;--okbg:#e3f6ec;--bad:#b42318;--badbg:#fdeaea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--fg:#e8ebf2;--mut:#9aa3b5;--bd:#2c3347;--ac:#6ea0ff;--acbg:#22305a;--ok:#5ad39a;--okbg:#123626;--bad:#ff8a80;--badbg:#401c1c}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--fg:#e8ebf2;--mut:#9aa3b5;--bd:#2c3347;--ac:#6ea0ff;--acbg:#22305a;--ok:#5ad39a;--okbg:#123626;--bad:#ff8a80;--badbg:#401c1c}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:1.4rem;margin:.2em 0 .1em}h2{font-size:1.05rem;margin:1.2em 0 .5em}
.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:9px 14px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.modes button{text-align:left;padding:12px}.modes b{display:block}
label.chk{display:flex;gap:6px;align-items:center;margin-right:12px}
input[type=number]{width:70px;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
textarea{width:100%;min-height:90px;font:12px/1.4 monospace;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px}
.tag{font-size:.78rem;color:var(--mut);margin-bottom:4px}
.q{white-space:pre-line;margin-bottom:8px}
.opt{display:flex;gap:8px;width:100%;text-align:left;margin:5px 0;padding:9px 11px;white-space:pre-line}
.opt.sel{border-color:var(--ac);background:var(--acbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt i{font-style:normal;font-weight:700;min-width:1.2em}
.bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.score{font-size:2rem;font-weight:700}
.bd-ok{border-left:5px solid var(--ok)}.bd-bad{border-left:5px solid var(--bad)}.bd-na{border-left:5px solid var(--mut)}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<script>

const MC=(t,o,a)=>({t,o,a:"ABCD".indexOf(a)});

TF("Electron của nguyên tử hydrogen chuyển từ mức n = 3 xuống mức n = 2 thì phát ra một lượng tử năng lượng.","Đ"),
TF("Trong một nguyên tử, không thể có hai electron có cùng một bộ bốn số lượng tử (n, l, mₗ, mₛ).","Đ"),
TF("Bộ số lượng tử n = 2, l = 1, mₗ = 0, mₛ = +1/2 là một bộ số lượng tử hợp lệ.","Đ"),
TF("Cách phân bố sáu electron trên năm orbital của phân lớp 3d như sau: [↑↓] [↑↓] [↑] [↑] [ ] tuân thủ quy tắc Hund.","S"),
TF("Các nguyên tố có tính chất hóa học tương tự nhau được xếp trong cùng một cột của bảng tuần hoàn.","Đ"),
TF("Trong nhóm halogen, iodine nằm dưới chlorine nên I₂ có tính oxi hóa mạnh hơn Cl₂.","S"),
TF("Natri (sodium) có cấu hình electron 1s² 2s² 2p⁶ 3s¹ nên thuộc chu kỳ 3 và nhóm IA (nhóm 1).","Đ"),
TF("Ở trạng thái cơ bản, các electron trong nguyên tử lần lượt chiếm các orbital theo chiều năng lượng từ cao xuống thấp.","S"),
TF("Các nguyên tố có cùng số lớp electron được xếp cùng một hàng, gọi là chu kì.","Đ"),
TF("Theo quy tắc (n + l) dùng để dự đoán thứ tự điền electron trong nguyên tử nhiều electron, AO có n + l nhỏ hơn thường có năng lượng thấp hơn.","Đ"),
TF("Theo quy tắc (n + l), khi hai AO có cùng n + l, AO có n nhỏ hơn thường có năng lượng cao hơn.","S"),
TF("Ion K⁺ và ion Cl⁻ có cấu hình electron giống nhau, biết K có Z = 19 và Cl có Z = 17.","Đ"),
TF("Trong cấu hình electron nguyên tử ở trạng thái cơ bản, nếu electron cuối cùng được điền vào phân lớp s hoặc d thì nguyên tố luôn thuộc nhóm chính.","S"),
TF("Cấu hình electron của ion Fe²⁺ là 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁴ 4s², biết Z(Fe) = 26.","S"),
TF("Chu kì 3 và chu kì 4 đều có 18 nguyên tố.","S"),
TF("Theo quy tắc (n + l), các phân lớp có thứ tự năng lượng tăng dần: 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s, 4d, 5p, 6s, 5d, 4f, 6p, 7s.","S"),
TF("Ion Mg²⁺ có cấu hình electron 1s² 2s² 2p⁶; do có 10 electron nên điện tích hạt nhân của ion là +10e.","S"),
MC("Phân lớp d có bao nhiêu orbital?",["3 orbital.","5 orbital.","7 orbital.","10 orbital."],"B"),

MC("Sắt có Z = 26. Cấu hình electron trạng thái cơ bản nào đúng?",["1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁸.","1s² 2s² 2p⁶ 3s² 3p⁶ 4s⁴ 3d⁴.","1s² 2s² 2p⁶ 3s² 3p⁵ 3d⁷ 4s².","1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s²."],"D"),
MC("Dấu hiệu nào trong cấu hình electron được sử dụng trực tiếp để xác định số thứ tự chu kỳ?",["Tổng số electron độc thân.","Giá trị số lượng tử chính n lớn nhất.","Tổng số orbital đã có electron.","Số electron của phân lớp d."],"B"),
MC("Đối với các nguyên tố nhóm chính trong một chu kì (bỏ qua khí hiếm), xu hướng chung nào đúng?",["Bán kính tăng, tính khử tăng và tính oxy hóa giảm.","Bán kính tăng, tính khử giảm và tính oxy hóa tăng.","Bán kính không đổi, tính khử và tính oxy hóa không đổi.","Bán kính giảm, tính khử giảm và tính oxy hóa tăng."],"D"),
MC("Chlorine có Z = 17, cấu hình electron kết thúc 3s²3p⁵. Khi tạo ion đơn nguyên tử bền, chlorine có xu hướng nào?",["Nhường 1 electron để tạo Cl⁺.","Nhường 2 electron để tạo Cl²⁺.","Nhận 1 electron để tạo Cl⁻.","Nhận 2 electron để tạo Cl²⁻."],"C"),

MC("Một nguyên tố X có cấu hình electron kết thúc 3s²3p⁴. Vị trí của X trong bảng tuần hoàn là:",["Chu kỳ 3, nhóm IVA (nhóm 14).","Chu kỳ 3, nhóm VIA (nhóm 16).","Chu kỳ 4, nhóm VIA (nhóm 16).","Chu kỳ 3, nhóm VIB (nhóm 6)."],"B"),

MC("Đồng vị là những nguyên tử của cùng một nguyên tố, có số p bằng nhau nhưng khác nhau số:",["Neutron","Electron","Proton","Orbital"],"A"),

{n:"Bài 2 – Cấu tạo phân tử và liên kết hóa học",q:[

TF("Theo thuyết liên kết hóa trị (VB), khi hình thành liên kết cộng hóa trị, mức độ xen phủ giữa các orbital càng lớn thì liên kết thường càng bền.","Đ"),

TF("Trong phân tử có liên kết bội (liên kết đôi hoặc liên kết ba) luôn chỉ có một liên kết π.","S"),

TF("Trừ các khí hiếm, phần lớn nguyên tử thường liên kết với nhau để tạo thành phân tử hoặc mạng tinh thể.","Đ"),

const ALL=[];CH.forEach((c,i)=>c.q.forEach((q,j)=>{q.id=(i+1)+"-"+(j+1);q.ch=i;q.no=j+1;q.tf=j<18&&q.o.length===2&&q.o[0]==="Đúng";ALL.push(q)}));
const BY={};ALL.forEach(q=>BY[q.id]=q);
const KEY="hoa-dai-cuong-quiz-v1";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fresh=()=>({stats:{},hist:[],sess:null});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
if(!S.stats)S.stats={};if(!S.hist)S.hist=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=document.getElementById("app");
let sel=[0,1,2];

function home(msg){
  const chs=sel.length?sel:[0,1,2];
  const pool=ALL.filter(q=>sel.includes(q.ch));
  const wrong=pool.filter(q=>S.stats[q.id]&&S.stats[q.id].last===0);

  const done=ALL.filter(q=>S.stats[q.id]);
  const sess=S.sess&&!S.sess.sub?S.sess:null;
  let h=`<h1>Luyện trắc nghiệm Hóa đại cương</h1><div class="mut">117 câu · 3 bài · tiến độ được lưu trong trình duyệt này</div>`;
  if(msg)h+=`<div class="card">${esc(msg)}</div>`;
  if(sess)h+=`<div class="card row"><div style="flex:1">Bạn đang làm dở một bài (${Object.keys(sess.ans).length}/${sess.ids.length} câu đã chọn).</div><button class="p" id="resume">Tiếp tục</button></div>`;

  h+=`<h2>2. Chọn cách làm</h2><div class="modes">
  <button class="p" id="mAll"><b>Làm toàn bộ</b>${pool.length} câu theo thứ tự</button>
  <button id="mRnd"><b>Làm ngẫu nhiên</b>Trộn thứ tự, chọn số câu bên dưới</button>

  <button id="mNew" ${fresh_.length?"":"disabled"}><b>Làm câu chưa làm</b>${fresh_.length} câu</button></div>
  <div class="row" style="margin-top:10px"><span>Số câu ngẫu nhiên:</span><input type="number" id="nRnd" min="1" max="117" value="20"></div>`;
  h+=`<h2>Thống kê</h2><div class="card"><table><tr><th>Bài</th><th>Đã làm</th><th>Đúng lần gần nhất</th><th>Sai lần gần nhất</th></tr>`+CH.map((c,i)=>{const qs=ALL.filter(q=>q.ch===i);const d=qs.filter(q=>S.stats[q.id]);const ok=d.filter(q=>S.stats[q.id].last===1).length;return `<tr><td>${esc(c.n.split(" – ")[0])}</td><td>${d.length}/${qs.length}</td><td>${ok}</td><td>${d.length-ok}</td></tr>`}).join("")+`</table><div class="mut" style="margin-top:6px">Tổng: ${done.length}/117 câu đã làm.</div></div>`;
  h+=`<h2>Lịch sử các lần làm</h2><div class="card">`+(S.hist.length?`<table><tr><th>Thời gian</th><th>Chế độ</th><th>Kết quả</th></tr>`+S.hist.slice(-10).reverse().map(x=>`<tr><td>${new Date(x.t).toLocaleString("vi-VN")}</td><td>${esc(x.mode)}</td><td>${x.ok}/${x.tot} (${Math.round(100*x.ok/x.tot)}%)</td></tr>`).join("")+`</table>`:`<span class="mut">Chưa có lần làm nào.</span>`)+`</div>`;
  h+=`<h2>Sao lưu và khôi phục</h2><div class="card"><div class="mut">Dữ liệu nằm trong trình duyệt này. Muốn dùng ở máy khác, bấm Xuất dữ liệu, sao chép đoạn chữ, rồi dán vào máy kia và bấm Nhập dữ liệu.</div><textarea id="bk" placeholder="Dán dữ liệu vào đây để nhập"></textarea><div class="row" style="margin-top:8px"><button id="ex">Xuất dữ liệu</button><button id="im">Nhập dữ liệu</button><button id="rs">Xóa toàn bộ tiến độ</button></div></div>`;

  const nz=()=>sel.length?pool:ALL;
  if(sess)document.getElementById("resume").onclick=quiz;

  document.getElementById("mNew").onclick=()=>go(fresh_,"Câu chưa làm");

  document.getElementById("rs").onclick=()=>{if(S._c){S=fresh();save();home("Đã xóa toàn bộ tiến độ.")}else{S._c=1;document.getElementById("rs").textContent="Bấm lần nữa để xác nhận xóa"}};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function quiz(){
  const ss=S.sess;if(!ss){home();return}
  const sub=ss.sub;
  let ok=0;
  let h=`<h1>${esc(ss.mode)}</h1>`;
  if(sub){ss.ids.forEach(id=>{if(ss.ans[id]===BY[id].a)ok++});h+=`<div class="card"><div class="score">${ok}/${ss.ids.length} <span class="mut" style="font-size:1rem">(${Math.round(100*ok/ss.ids.length)}%)</span></div><div class="mut">Câu bỏ trống được tính là sai.</div></div>`}
  h+=ss.ids.map((id,k)=>{const q=BY[id];const a=ss.ans[id];
    let cls="";if(sub)cls=a===undefined?"bd-na":a===q.a?"bd-ok":"bd-bad";
    return `<div class="card ${cls}"><div class="tag">${esc(CH[q.ch].n.split(" – ")[0])} · Câu ${q.no} · (${k+1}/${ss.ids.length})${sub?(a===undefined?" · Chưa chọn":a===q.a?" · Đúng":" · Sai"):""}</div><div class="q">${esc(q.t)}</div>`+
    q.o.map((o,i)=>{let c="opt";if(sub){if(i===q.a)c+=" ok";else if(i===a)c+=" bad"}else if(i===a)c+=" sel";return `<button class="${c}" data-q="${id}" data-i="${i}"><i>${"ABCD"[i]}.</i><span>${esc(o)}</span></button>`}).join("")+`</div>`}).join("");
  const n=Object.keys(ss.ans).length;
  h+=`<div class="bar">`+(sub?`<span>Kết quả: ${ok}/${ss.ids.length}</span><span class="row"><button id="redo" ${ok===ss.ids.length?"disabled":""}>Làm lại câu sai của bài này</button><button class="p" id="back">Về trang chính</button></span>`:`<span id="cnt">Đã chọn ${n}/${ss.ids.length}</span><span class="row"><button id="back">Thoát (lưu nháp)</button><button class="p" id="sub">Nộp bài</button></span>`)+`</div>`;
  $.innerHTML=h;
  if(!sub)$.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const id=b.dataset.q,i=+b.dataset.i;ss.ans[id]=i;save();
    $.querySelectorAll(`[data-q="${id}"]`).forEach(x=>x.classList.toggle("sel",+x.dataset.i===i));
    document.getElementById("cnt").textContent=`Đã chọn ${Object.keys(ss.ans).length}/${ss.ids.length}`});
  document.getElementById("back").onclick=()=>{if(sub)S.sess=null;save();home()};
  if(!sub)document.getElementById("sub").onclick=()=>{
    ss.ids.forEach(id=>{const a=ss.ans[id];if(a===undefined)return;const s=S.stats[id]||(S.stats[id]={n:0,ok:0,last:0});s.n++;if(a===BY[id].a){s.ok++;s.last=1}else s.last=0});
    let c=0;ss.ids.forEach(id=>{if(ss.ans[id]===BY[id].a)c++});
    S.hist.push({t:Date.now(),mode:ss.mode,tot:ss.ids.length,ok:c});if(S.hist.length>200)S.hist=S.hist.slice(-200);
    ss.sub=true;save();quiz();window.scrollTo(0,0)};
  else document.getElementById("redo").onclick=()=>{const w=ss.ids.filter(id=>ss.ans[id]!==BY[id].a);S.sess={mode:"Làm lại câu sai",ids:w,ans:{},sub:false};save();quiz();window.scrollTo(0,0)};
}
home();
</script>
</body>
</html>
